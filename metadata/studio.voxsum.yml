# fdroiddata recipe for VoxSum. Copy into fdroiddata/metadata/studio.voxsum.yml when
# submitting the Merge Request. See FDROID_SUBMISSION.md for the full playbook and the
# onnxruntime offline-build caveat (the main packaging challenge).
Categories:
  - Multimedia
License: GPL-3.0-or-later
AuthorName: vieenrose
SourceCode: https://github.com/vieenrose/VoxSumDroid
IssueTracker: https://github.com/vieenrose/VoxSumDroid/issues

RepoType: git
Repo: https://github.com/vieenrose/VoxSumDroid.git

Builds:
  - versionName: "0.1.0"
    versionCode: 1
    commit: v0.1.0
    submodules: true          # native/sherpa-onnx, native/llama.cpp, native/onnxruntime
    ndk: r27c                 # == 27.2.12479018 (matches app/build.gradle.kts ndkVersion)
    # Build onnxruntime from the pinned submodule (the build VM has network), then build the
    # app. All in one `build:` block so the SHERPA_ONNXRUNTIME_* exports reach the gradle/NDK
    # step. No prebuilt binaries are committed; everything compiles from source.
    build:
      - export ANDROID_NDK="$$NDK$$"
      - export ORT_SRC="$$WORKDIR$$/native/onnxruntime"
      - export PATH="$HOME/.local/bin:$PATH"
      - pip3 install --user "cmake>=3.28" packaging
      - ./scripts/build-onnxruntime-android.sh
      - export SHERPA_ONNXRUNTIME_LIB_DIR="$HOME/ort-build/Release"
      - export SHERPA_ONNXRUNTIME_INCLUDE_DIR="$HOME/ort-headers"
      - ./gradlew :app:assembleRelease
    # NOTE: the onnxruntime + sherpa-onnx + llama.cpp build is heavy (~40 min on a 4-core
    # runner, several GB). This may exceed F-Droid's default build limits — raise it with
    # maintainers early (see FDROID_SUBMISSION.md "Build is heavy"). The recipe's build-field
    # env wiring + NDK path will likely need one iteration against `fdroid build`.

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: "0.1.0"
CurrentVersionCode: 1

# AntiFeatures for the GitHub/self-hosted build: the in-app updater uses REQUEST_INSTALL_PACKAGES
# to download + install the signed APK (this is the "UpstreamNonFree"/self-update behaviour F-Droid
# flags). For an official f-droid.org (Route A) submission, the updater must be removed via a
# dedicated `fdroid` product flavor (not yet implemented) — the F-Droid client provides updates
# there, so the in-app updater is redundant. Models are FOSS (Apache-2.0 / MIT), SHA-256-pinned, and
# downloaded at first run from upstream release pages (or side-loaded). If the optional
# podcast/YouTube flavor is added later, declare NonFreeNet on that flavor.
