name: Build & publish F-Droid repo

# Route B delivery: on every version tag, build onnxruntime from source, build a signed
# release APK, generate an F-Droid repo, and publish it to GitHub Pages. Users add
# https://<owner>.github.io/<repo>/repo as a repository in the F-Droid / Droid-ify client.
#
# Requires repo secrets (see RELEASING.md):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# and Settings → Pages → Source = "GitHub Actions".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORT_BUILD: /home/runner/ort-build
      ORT_HEADERS: /home/runner/ort-headers
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK + cmake + platform
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Host build deps (recent cmake for onnxruntime)
        run: python -m pip install --upgrade pip "cmake>=3.28" packaging

      # onnxruntime is the slow step — cache the built lib + headers across runs.
      - name: Cache onnxruntime build
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/ort-build/Release/libonnxruntime.so
            ~/ort-headers
          key: ort-v1.24.3-arm64-${{ hashFiles('scripts/build-onnxruntime-android.sh') }}

      - name: Build onnxruntime from source (Android arm64)
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-onnxruntime-android.sh

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          SHERPA_ONNXRUNTIME_LIB_DIR: ${{ env.ORT_BUILD }}/Release
          SHERPA_ONNXRUNTIME_INCLUDE_DIR: ${{ env.ORT_HEADERS }}
          VOXSUM_KEYSTORE: ${{ runner.temp }}/release.keystore
          VOXSUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOXSUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOXSUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Generate F-Droid repo
        env:
          VOXSUM_KEYSTORE: ${{ runner.temp }}/release.keystore
          VOXSUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOXSUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOXSUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FDROID_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
        run: |
          python -m pip install fdroidserver
          ./scripts/make-fdroid-repo.sh app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
