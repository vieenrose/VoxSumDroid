name: Build & publish F-Droid repo

# Route B delivery. Two modes:
#  - workflow_dispatch (manual "Run workflow"): DRY RUN — builds the app and uploads the APK
#    as an artifact, so you can confirm the heavy onnxruntime-from-source build actually fits
#    a GitHub runner BEFORE setting up a keystore. No secrets needed.
#  - push tag v*: full release — builds a SIGNED APK, generates an F-Droid repo, publishes it
#    to GitHub Pages (needs secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD
#    and Settings -> Pages -> Source = GitHub Actions). See RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create GitHub Releases on tags
  pages: write
  id-token: write

concurrency:
  group: fdroid-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90    # LiteRT-only native build (no more ORT-from-source)
    outputs:
      has_keystore: ${{ steps.ks.outputs.has }}
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      # Surface keystore presence as a job output (job-level `if` can't read `secrets`).
      - id: ks
        run: echo "has=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      # Everything native is LiteRT: libLiteRt/accelerator prebuilts live in jniLibs and
      # voxsum-mosslite builds from in-repo sources — no submodules, no ORT-from-source.
      # llama.cpp is a submodule (native/llama.cpp) and CMakeLists.txt add_subdirectory()s it, so
      # the native build cannot configure without it. This was `false` from before the summarizer
      # moved back to llama.cpp, which broke every release build from that migration onward — the
      # failure only surfaced at v0.37.0 because nothing had cut a release in between.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false        # we install our own NDK/cmake below
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK + cmake + platform
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      # Gate the release on the host test suite. v0.36.0 shipped with an instrumented suite that
      # did not even COMPILE (it still referenced the LiteRT engine deleted in the migration),
      # because this workflow only ever built the APK. Unit tests are seconds; the release APK is
      # minutes — failing here is far cheaper than shipping.
      #
      # Host (JVM) tests only. The instrumented suite needs a device and multi-hundred-MB models,
      # so it stays a manual on-device step (see TextGenTest / SummarizerQualityTest).
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Signed release when a keystore is configured; otherwise a debug APK so the dry run
      # still validates the native build end to end.
      - name: Build APK
        env:
          VOXSUM_KEYSTORE: ${{ runner.temp }}/release.keystore
          VOXSUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOXSUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOXSUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifact (always — proves the build works)
        uses: actions/upload-artifact@v4
        with:
          name: voxsum-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish signed APK as a GitHub Release
        if: ${{ github.ref_type == 'tag' && env.HAS_KEYSTORE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "voxsum-${GITHUB_REF_NAME}.apk"
          NOTES="Offline on-device transcription + diarization + summarization. Sideload the APK, or add the F-Droid repo: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo"
          gh release create "$GITHUB_REF_NAME" "voxsum-${GITHUB_REF_NAME}.apk" \
            --title "VoxSum $GITHUB_REF_NAME" --notes "$NOTES" \
          || gh release upload "$GITHUB_REF_NAME" "voxsum-${GITHUB_REF_NAME}.apk" --clobber

      - name: Generate F-Droid repo
        if: env.HAS_KEYSTORE == 'true'
        env:
          VOXSUM_KEYSTORE: ${{ runner.temp }}/release.keystore
          VOXSUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOXSUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOXSUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FDROID_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
        run: |
          python -m pip install fdroidserver
          ./scripts/make-fdroid-repo.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload Pages artifact
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid

  # Publish to Pages only on a real tagged release with a keystore configured.
  deploy:
    needs: build
    if: ${{ github.ref_type == 'tag' && needs.build.outputs.has_keystore == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
