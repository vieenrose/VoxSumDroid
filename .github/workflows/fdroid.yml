name: Build & publish release APK

# Two modes:
#  - workflow_dispatch (manual "Run workflow"): DRY RUN — builds the app and uploads the APK
#    as an artifact, so you can confirm the heavy onnxruntime-from-source build actually fits
#    a GitHub runner BEFORE setting up a keystore. No secrets needed.
#  - push tag v*: full release — builds a SIGNED APK and publishes it as a GitHub Release
#    (needs secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD). See RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create GitHub Releases on tags

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ORT-from-source on 4 cores is slow; stay under the 6h cap
    outputs:
      has_keystore: ${{ steps.ks.outputs.has }}
    env:
      ORT_SRC: /home/runner/ort-src
      ORT_BUILD: /home/runner/ort-build
      ORT_HEADERS: /home/runner/ort-headers
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      # Surface keystore presence as a job output (job-level `if` can't read `secrets`).
      - id: ks
        run: echo "has=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      # CI has network, so onnxruntime is cloned/built by the script — we only need the
      # sherpa + llama submodules for the app's CMake. Skipping the ORT submodule here saves
      # ~1 GB of checkout (the ORT submodule is only for F-Droid's OFFLINE build, Route A).
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init required submodules (sherpa + llama only)
        run: git submodule update --init --depth 1 native/sherpa-onnx native/llama.cpp

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false        # we install our own NDK/cmake below
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK + cmake + platform
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Host build deps (recent cmake for onnxruntime)
        run: python -m pip install --upgrade pip "cmake>=3.28" packaging

      # onnxruntime is the slow step — cache the built lib + headers across runs so only the
      # first run pays the full cost.
      - name: Cache onnxruntime build
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/ort-build/Release/libonnxruntime.so
            ~/ort-headers
          key: ort-v1.24.3-arm64-${{ hashFiles('scripts/build-onnxruntime-android.sh') }}

      - name: Build onnxruntime from source (Android arm64)
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-onnxruntime-android.sh
      - run: df -h /

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Signed release when a keystore is configured; otherwise a debug APK so the dry run
      # still validates the native build end to end.
      - name: Build APK
        env:
          SHERPA_ONNXRUNTIME_LIB_DIR: ${{ env.ORT_BUILD }}/Release
          SHERPA_ONNXRUNTIME_INCLUDE_DIR: ${{ env.ORT_HEADERS }}
          VOXSUM_KEYSTORE: ${{ runner.temp }}/release.keystore
          VOXSUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOXSUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOXSUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifact (always — proves the build works)
        uses: actions/upload-artifact@v4
        with:
          name: voxsum-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish signed APK as a GitHub Release
        if: ${{ github.ref_type == 'tag' && env.HAS_KEYSTORE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "voxsum-${GITHUB_REF_NAME}.apk"
          NOTES="Offline on-device transcription + diarization + summarization. Sideload the APK."
          gh release create "$GITHUB_REF_NAME" "voxsum-${GITHUB_REF_NAME}.apk" \
            --title "VoxSum $GITHUB_REF_NAME" --notes "$NOTES" \
          || gh release upload "$GITHUB_REF_NAME" "voxsum-${GITHUB_REF_NAME}.apk" --clobber
